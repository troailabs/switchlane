name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: npm pack --dry-run
        working-directory: sdk

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: switchlane
          POSTGRES_PASSWORD: switchlane
          POSTGRES_DB: switchlane
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U switchlane -d switchlane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: development
      GITHUB_TOKEN: ""
      DATABASE_URL: postgresql://switchlane:switchlane@localhost:5434/switchlane
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run benchmark

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e './python[test]'
      - run: python -m pytest python/tests
      - run: python -m build python

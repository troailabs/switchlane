services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: switchlane-db
    environment:
      POSTGRES_USER: switchlane
      POSTGRES_PASSWORD: switchlane
      POSTGRES_DB: switchlane
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchlane"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: switchlane-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    name: switchlane_pgdata
  redisdata:
    name: switchlane_redisdata
